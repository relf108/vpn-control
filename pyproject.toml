[project]
name = "vpn-control"
version = "0.3.0"
description = "Private authenticated API for a NixOS WireGuard gateway"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "gunicorn>=26,<27", "argon2-cffi>=23,<26"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S", "UP", "RUF"]

# Shared gateway sources retain suppressions for the server's stricter lint set.
[tool.ruff.lint.per-file-ignores]
"vpn_control.py" = ["RUF100"]
"test_vpn_control.py" = ["RUF100"]
"update_catalog.py" = ["RUF100"]
"network_runtime.py" = ["RUF100"]
